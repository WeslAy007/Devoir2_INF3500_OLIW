<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>


<header>

    <h1>☁ Weather Dashboard</h1>

    <nav>

    <a href="#dashboard">Dashboard</a>
    <a href="#forecast">Forecast</a>
    <a href="#map">Map</a>
    <a href="#alerts">Alerts</a>

</nav>


</header>


<section class="search">
    <h2>Rechercher de la météo</h2>
     
    <div class="search-icon">
        <input 
              id="cityInput"
              type="text"
             placeholder="Entrer une ville...">
     </div>
        

         <button id="searchBtn">
              Rechercher
        </button>


</section>



<main class="weather-card">


    <h2 id="location">
        Ville, Pays
    </h2>


    <p id="condition">
        Météo actuelle
    </p>


    <div class="temperature">

        <span id="temp">
            --°C
        </span>

    </div>



    <div class="details">


        <div>
            🌬 Vent
            <strong id="wind">
                -- km/h
            </strong>
        </div>



        <div>
            🌤 Etat
            <strong id="status">
                --
            </strong>
        </div>


    </div>


</main>

<footer>
    <p>&copy; 2026 Weather Dashboard. Tous droits réservés.</p>
</footer>
<script src="app.js"></script>

</body>

</html>
