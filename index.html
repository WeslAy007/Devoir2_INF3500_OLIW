<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Atlas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h2>🌍 World Atlas</h2>
    <div class="header-right">
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Rechercher...">
                    <button type="button" id="searchBtn"><i class="fas fa-search">rechercher</i></button>
                </div>

    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Countries</a></li>
            <li><a href="#">Regions</a></li>
            <li><a href="#">Map</a></li>
            <li><a href="#">About</a></li>
        </ul>
    </nav>
    </div>
</header>

<p><a href="#">← Back to Americas</a></p>

<div class="card" id="card">

    <div class="flag">
        <img src="pictures/flag.svg" alt="Flag of Haiti">
    </div>

    <div class="info">
        <h1 id="name">Haiti</h1>

        <p><strong>Name :      </strong> <span id="countryName">Haiti</span></p>
        <p><strong>Capital :   </strong> <span id="capital"></span>Port-au-Prince</p>
        <p><strong>Population :</strong> <span id="population">11 402 533</span></p>
        <p><strong>Region :    </strong> <span id="region">Americas</span></p>
        <p><strong>Currency :  </strong> <span id="currency">Haitian Gourdes(HTG)</span></p>
        <p><strong>Languages : </strong> <span id="languages">French, Haitian Creole</span></p>
    </div>

</div>

<script src="script.js"></script>


</body>
</html>
